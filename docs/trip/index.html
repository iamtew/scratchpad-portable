<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Are you ready?</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="pixi" aria-hidden="true"></canvas>

    <header class="bar" hidden>
      <button type="button" class="nav" id="stop">
        <span class="icon icon-x" aria-hidden="true"></span>
        Stop
      </button>
      <div class="transport">
        <span id="time" class="time">0:00 / 0:00</span>
        <input id="seek" class="fader" type="range" min="0" max="1" step="0.001" value="0" aria-label="Seek">
      </div>
      <div class="audio">
        <button type="button" id="mute" aria-pressed="false" aria-label="Mute">
          <span class="icon icon-vol" aria-hidden="true"></span>
          <span class="icon icon-vol-off" aria-hidden="true"></span>
        </button>
        <input id="vol" class="fader" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </div>
    </header>

    <div class="gate">
      <a class="nav gate-home" href="../">
        <span class="icon icon-back" aria-hidden="true"></span>
        Home
      </a>
      <div class="vaps" aria-hidden="true">
        <span class="vap vap-a"></span>
        <span class="vap vap-b"></span>
        <span class="vap vap-c"></span>
        <span class="vap vap-d"></span>
      </div>
      <button type="button" class="begin" id="begin">Begin</button>
    </div>

    <script src="../vendor/pixi/pixi.min.js"></script>
    <script src="music.js"></script>
    <script src="trip.js"></script>
  </body>
</html>
